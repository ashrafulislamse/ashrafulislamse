<svg xmlns="http://www.w3.org/2000/svg" width="840" height="260" viewBox="0 0 840 260" role="img" aria-label="Ashraful Islam — AI Agent Developer and Full-Stack Engineer">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1a"/>
      <stop offset="55%" stop-color="#101827"/>
      <stop offset="100%" stop-color="#0d1424"/>
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDBA74">
        <animate attributeName="stop-color" values="#FDBA74;#F97316;#FB923C;#FDBA74" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#F97316">
        <animate attributeName="stop-color" values="#F97316;#EA580C;#FDBA74;#F97316" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#FB923C">
        <animate attributeName="stop-color" values="#FB923C;#F97316;#FDBA74;#FB923C" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="sweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0"/>
      <stop offset="45%" stop-color="#FDBA74" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#FDBA74" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
      <animate attributeName="x1" values="-60%;0%" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;60%" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.30">
        <animate attributeName="stop-opacity" values="0.30;0.14;0.30" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloSoft" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#ffffff" fill-opacity="0.045"/>
    </pattern>
    <clipPath id="round">
      <rect width="840" height="260" rx="16"/>
    </clipPath>
    <filter id="blurS" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <g clip-path="url(#round)">
    <rect width="840" height="260" fill="url(#bg)"/>
    <rect width="840" height="260" fill="url(#dots)"/>

    <!-- ambient halos -->
    <circle cx="730" cy="120" r="130" fill="url(#halo)"/>
    <circle cx="90" cy="230" r="120" fill="url(#haloSoft)"/>

    <!-- the portfolio flame petal, faint, breathing behind the monogram -->
    <g transform="translate(560,10) scale(0.42)">
      <path d="M430 1005 C425 850 455 700 480 560 C505 420 535 300 555 195 C565 140 545 95 505 105 C470 114 460 165 448 240 C425 390 400 560 390 740 C384 850 390 940 396 1005 Z"
            fill="#F97316" opacity="0.14">
        <animate attributeName="opacity" values="0.14;0.05;0.14" dur="7s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- floating flame particles (brand tie: the portfolio flame) -->
    <g fill="#F97316">
      <circle cx="120" cy="200" r="3" opacity="0.5">
        <animate attributeName="cy" values="200;120;200" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0.05;0.5" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="190" cy="225" r="2" opacity="0.4">
        <animate attributeName="cy" values="225;130;225" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.4;0.05;0.4" dur="9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="640" cy="215" r="2.5" opacity="0.45">
        <animate attributeName="cy" values="215;115;215" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.45;0.05;0.45" dur="8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="705" cy="235" r="2" opacity="0.4">
        <animate attributeName="cy" values="235;140;235" dur="10s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.4;0.05;0.4" dur="10s" repeatCount="indefinite"/>
      </circle>
      <circle cx="570" cy="240" r="1.8" opacity="0.35">
        <animate attributeName="cy" values="240;160;240" dur="7.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.35;0.04;0.35" dur="7.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- THE BRAND LOGO (from the website): charcoal A + vivid orange bar, in an orbiting ring -->
    <circle cx="700" cy="122" r="62" fill="none" stroke="#F97316" stroke-opacity="0.22" stroke-width="12" filter="url(#blurS)"/>
    <circle cx="700" cy="122" r="62" fill="none" stroke="url(#brand)" stroke-width="2.5" stroke-dasharray="245 145" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" from="0" to="-390" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="122" r="48" fill="none" stroke="#F97316" stroke-opacity="0.20" stroke-width="1.2"/>
    <!-- logo mark: viewBox 320x320 -> scaled into the ring -->
    <g transform="translate(636,58) scale(0.40)">
      <path d="M62 232 126 76h34l64 156h-38l-13-34H112l-13 34H62Zm62-65h37l-18-49-19 49Z" fill="#e6edf3"/>
      <rect x="226" y="76" width="24" height="156" rx="5" fill="#F45116"/>
    </g>

    <!-- name: ASHRAFUL ISLAM with sweep shine -->
    <text x="52" y="102" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="46" font-weight="700" fill="#f0f6fc" letter-spacing="1">ASHRAFUL ISLAM</text>
    <rect x="52" y="62" width="560" height="46" fill="url(#sweep)" style="mix-blend-mode:screen"/>

    <!-- role cycler: one line visible at a time (CSS keyframes, img-safe) -->
    <style>
      .role { opacity: 0; animation: roleCycle 9s infinite; }
      .r1 { animation-delay: 0s; } .r2 { animation-delay: 3s; } .r3 { animation-delay: 6s; }
      @keyframes roleCycle { 0% {opacity:0} 4% {opacity:1} 30% {opacity:1} 36% {opacity:0} 100% {opacity:0} }
    </style>
    <g font-family="Consolas,Menlo,monospace" font-size="17" fill="#FDBA74">
      <text class="role r1" x="54" y="146">AI Agent Developer</text>
      <text class="role r2" x="54" y="146">Full-Stack · Mobile · LLM Systems</text>
      <text class="role r3" x="54" y="146">Open to internships — 2027</text>
    </g>

    <!-- evidence line + underline -->
    <text x="54" y="186" font-family="Consolas,Menlo,monospace" font-size="14" fill="#8b949e">Every claim on this profile links to evidence — live products, real tests, verified certs.</text>
    <rect x="52" y="200" width="220" height="3" rx="1.5" fill="url(#brand)">
      <animate attributeName="width" values="220;330;220" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- location chip -->
    <g font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="12.5">
      <rect x="54" y="216" width="196" height="26" rx="13" fill="#F97316" fill-opacity="0.12" stroke="#F97316" stroke-opacity="0.35"/>
      <circle cx="72" cy="229" r="3.2" fill="#F97316">
        <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text x="82" y="233" fill="#FDBA74">Kuala Lumpur, Malaysia</text>
    </g>
  </g>
  <rect width="839" height="259" x="0.5" y="0.5" rx="15.5" fill="none" stroke="#F97316" stroke-opacity="0.18"/>
</svg>
